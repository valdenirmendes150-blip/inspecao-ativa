<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inspeção Ativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#EEF0F2;--surface:#FFFFFF;--surface2:#F6F7F8;--ink:#1E2A33;--muted:#5B6874;--line:#D5DAE0;
  --ore:#A53D03;--ore-ink:#FFFFFF;--ore-soft:#F6E6DB;
  --ok:#2E7D4F;--ok-soft:#E1F1E7;--nc:#B3261E;--nc-soft:#F8E1DF;--na:#5F6873;--na-soft:#E6E9EC;
  --nr:#2F5D7C;--nr-soft:#DDE8F0;--ges:#4F6B2E;--ges-soft:#E5EDDA;
  --side:#1E2A33;--side-ink:#E8ECEF;--side-muted:#93A1AD;
  --shadow:0 1px 2px rgba(30,42,51,.08),0 4px 14px rgba(30,42,51,.06);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181D;--surface:#1A2228;--surface2:#212A31;--ink:#E6EAEE;--muted:#9AA6B1;--line:#2E3A44;
  --ore:#E07A3A;--ore-ink:#1A0E06;--ore-soft:#3A2418;
  --ok:#5CC08A;--ok-soft:#173222;--nc:#F07468;--nc-soft:#3E1D1A;--na:#A7B1BB;--na-soft:#29323A;
  --nr:#7FB0D2;--nr-soft:#1C2C38;--ges:#A3C47A;--ges-soft:#232E19;
  --side:#0E1317;--side-ink:#E6EAEE;--side-muted:#8592A0;--shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12181D;--surface:#1A2228;--surface2:#212A31;--ink:#E6EAEE;--muted:#9AA6B1;--line:#2E3A44;
  --ore:#E07A3A;--ore-ink:#1A0E06;--ore-soft:#3A2418;
  --ok:#5CC08A;--ok-soft:#173222;--nc:#F07468;--nc-soft:#3E1D1A;--na:#A7B1BB;--na-soft:#29323A;
  --nr:#7FB0D2;--nr-soft:#1C2C38;--ges:#A3C47A;--ges-soft:#232E19;
  --side:#0E1317;--side-ink:#E6EAEE;--side-muted:#8592A0;--shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ore);outline-offset:2px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;line-height:1.15;margin:0}
h1{font-size:30px;letter-spacing:.2px}
h2{font-size:21px}
h3{font-size:17px}
img{max-width:100%}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:248px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 14px 16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.brand-mark{width:38px;height:38px;border-radius:9px;background:var(--ore);display:grid;place-items:center;color:#fff}
.brand b{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;display:block;line-height:1}
.brand small{color:var(--side-muted);font-size:12px}
.nav-group{margin:6px 0 14px}
.nav-group p{color:var(--side-muted);font-size:12px;margin:0 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--ore);color:#fff}
.nav a .ic{width:20px;text-align:center}
.admin-row{display:flex;gap:6px;padding:10px 8px 0}.admin-row .btn{flex:1;background:transparent;color:var(--side-ink);border-color:rgba(255,255,255,.18);font-size:13px;padding:7px 8px}
.who{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding:14px 8px 0;display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:#33434F;display:grid;place-items:center;font-weight:600;flex:none}
.who-t{min-width:0;flex:1}
.who-t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.who-t span{font-size:12px;color:var(--side-muted)}
.icon-btn{background:none;border:0;color:inherit;padding:6px;border-radius:6px}
.icon-btn:hover{background:rgba(127,127,127,.15)}
main{flex:1;min-width:0;padding:28px 32px 60px}
.wrap{max-width:1100px;margin:0 auto}
/* topbar mobile */
.topbar{display:none}
.tabbar{display:none}
.page-h{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.page-h p{margin:4px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ore);border-color:var(--ore);color:var(--ore-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--nc)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.notice{border-left:4px solid var(--ore);background:var(--ore-soft);padding:12px 14px;border-radius:8px;margin-bottom:18px;font-size:14px}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:34px;font-weight:600;line-height:1.1;margin-top:4px}
.kpi.ok b{color:var(--ok)} .kpi.nc b{color:var(--nc)}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;margin-bottom:18px}.grid2>*,.kpis>*{min-width:0}
.panel{padding:18px 20px}
.panel h2{margin-bottom:12px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:72px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar .code{font-family:"Barlow Condensed",sans-serif;font-weight:600}
.bar .track{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--ore);border-radius:6px}
.bar .fill.ok{background:var(--ok)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.toplist{list-style:none;margin:0;padding:0}
.toplist li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.toplist li:last-child{border-bottom:0}
.toplist .n{flex:none;min-width:32px;height:24px;border-radius:12px;background:var(--nc-soft);color:var(--nc);font-weight:700;display:grid;place-items:center;font-size:13px}
.seg-filter{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg-filter button{border:0;background:none;padding:7px 12px;font-weight:500;font-size:14px}
.seg-filter button.on{background:var(--ink);color:var(--surface)}
.empty{padding:40px 20px;text-align:center}
.empty h2{margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto 16px;max-width:420px}
/* checklist grid */
.group-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.group-h:first-of-type{margin-top:4px}
.group-h span{color:var(--muted);font-size:14px}
.cl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cl{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 18px;text-decoration:none;color:var(--ink);overflow:hidden;transition:border-color .15s}
.cl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ore)}
.cl.g-nr::before{background:var(--nr)} .cl.g-gestao::before{background:var(--ges)}
.cl:hover{border-color:var(--ore)}
.cl .emo{font-size:24px;line-height:1;margin-top:2px}
.cl .code{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;line-height:1}
.cl .t{font-size:14px;margin-top:3px;line-height:1.3}
.cl .meta{font-size:12px;color:var(--muted);margin-top:6px}
.cl .draft{display:inline-block;margin-left:6px;color:var(--ore);font-weight:600}
/* form */
.form-h{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.form-h .emo{font-size:30px}
.form-h h1 small{display:block;font-family:"Barlow",sans-serif;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 16px;padding:18px 20px;margin-bottom:16px}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.fld label i{color:var(--nc);font-style:normal}
.inp{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:9px 11px;min-height:40px}
.inp:focus{border-color:var(--ore);outline:none;background:var(--surface)}
textarea.inp{min-height:78px;resize:vertical}
.fld.full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:20px;padding:5px 11px;font-size:13px}
.chip.on{background:var(--ore);border-color:var(--ore);color:var(--ore-ink)}
.miss{border-color:var(--nc)!important;box-shadow:0 0 0 2px var(--nc-soft)}
.sec{margin-bottom:14px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;user-select:none;border:0;background:none;width:100%;text-align:left}
.sec-h h2{flex:1;font-size:19px}
.sec-h .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-h .cnt .ncb{color:var(--nc);font-weight:700;margin-left:6px}
.sec-h .chev{transition:transform .2s;color:var(--muted)}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .sec-b{display:none}
.sec-b{border-top:1px solid var(--line)}
.sec-tools{display:flex;justify-content:flex-end;padding:8px 18px 0}
.item{padding:12px 18px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.is-nc{background:color-mix(in srgb,var(--nc-soft) 55%,transparent)}
.item-row{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.q{margin:0;font-weight:500}
.ans{display:flex;gap:6px;align-items:center}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;min-width:44px;white-space:nowrap}
.opt.o0.on{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.o1.on{background:var(--nc);border-color:var(--nc);color:#fff}
.opt.o2.on{background:var(--na);border-color:var(--na);color:var(--surface)}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:34px;display:grid;place-items:center;position:relative}
.tool .badge{position:absolute;top:-6px;right:-6px;background:var(--ore);color:#fff;border-radius:9px;font-size:11px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.extra{margin-top:10px;display:none}
.extra.show{display:block}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1;display:grid;place-items:center}
.add-ph{width:76px;height:76px;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);background:none;line-height:1.2}
.add-ph:hover{border-color:var(--ore);color:var(--ore)}
.finals{padding:18px 20px;margin-bottom:16px;display:grid;gap:16px}
.radio-list{display:flex;flex-wrap:wrap;gap:8px}
.radio-list button{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:9px 13px;font-weight:600;font-size:14px;text-align:left}
.radio-list button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.savebar{position:sticky;bottom:0;z-index:5;margin:0 -32px -60px;padding:12px 32px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px}
.prog{flex:1;min-width:0}
.prog .track{height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.prog .fill{height:100%;background:var(--ore);transition:width .25s}
.prog small{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
/* list */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.filters .inp{width:auto;min-width:160px;flex:1}
.filters select.inp{flex:0 1 220px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:92px 1fr 110px 120px 28px;gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface2)}
.row .code{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;line-height:1}
.row .sub{font-size:13px;color:var(--muted)}
.row .date{font-variant-numeric:tabular-nums;font-size:14px}
.pct{font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.nc{background:var(--nc-soft);color:var(--nc)} .pill.warn{background:var(--ore-soft);color:var(--ore)} .pill.na{background:var(--na-soft);color:var(--na)}
/* detail */
.det-head{padding:18px 20px;margin-bottom:16px}
.det-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 18px;margin-top:14px}
.det-grid div span{display:block;font-size:12px;color:var(--muted)}
.det-grid div b{font-weight:600}
.score{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.score div{font-size:14px} .score b{font-family:"Barlow Condensed",sans-serif;font-size:26px;display:block;line-height:1}
.ans-list .item-row{grid-template-columns:1fr auto}
.tag{font-size:13px;font-weight:700;padding:3px 9px;border-radius:7px}
.tag.o0{background:var(--ok-soft);color:var(--ok)} .tag.o1{background:var(--nc-soft);color:var(--nc)} .tag.o2{background:var(--na-soft);color:var(--na)}
.note{margin:6px 0 0;font-size:14px;color:var(--muted);white-space:pre-wrap}
.det-actions{display:flex;flex-wrap:wrap;gap:8px}
/* modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,18,.55);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;max-width:440px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h2{margin-bottom:8px}
.modal p{margin:0 0 14px;color:var(--muted)}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:grid;place-items:center;padding:20px}
.lightbox img{max-height:90vh;max-width:100%;border-radius:6px}
.lightbox button{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:rgba(255,255,255,.15);color:#fff;border:0;width:40px;height:40px;border-radius:50%;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:60px;text-align:center;color:var(--muted)}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--side);color:var(--side-ink);padding:10px 14px}
  .topbar .brand-mark{width:30px;height:30px;border-radius:7px}
  .topbar b{font-family:"Barlow Condensed",sans-serif;font-size:20px;flex:1}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
  .app{display:block;min-height:0}
  main{padding:18px 14px 96px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600;border-radius:8px}
  .tabbar a .ic{font-size:19px;line-height:1.1}
  .tabbar a.on{color:var(--ore)}
  body.in-form .tabbar,body.no-tabs .tabbar{display:none}
  body.no-tabs main{padding-bottom:24px}
  body.in-form main{padding-bottom:20px}
  h1{font-size:26px}
  .kpi b{font-size:28px}
  .item{padding:12px 14px}
  .item-row{grid-template-columns:1fr}
  .ans{flex-wrap:nowrap}
  .ans .opt{flex:1;padding:9px 4px}
  .fields,.finals{padding:14px}
  .sec-h{padding:13px 14px}
  .savebar{margin:0 -14px -20px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
  .row{grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px}
  .row .c-date{grid-column:1;grid-row:2}
  .row .c-main{grid-column:1;grid-row:1}
  .row .c-pct{grid-column:2;grid-row:1;text-align:right}
  .row .c-res{grid-column:2;grid-row:2;text-align:right}
  .row .c-ph{display:none}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .side,.topbar,.tabbar,.savebar,.det-actions,.no-print{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0}
  .card{box-shadow:none;border-color:#ccc}
  .sec.closed .sec-b{display:block}
  .item{break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><path d="M5 4h14v14l-7 3-7-3z"/></svg></div><div><b>Inspeção Ativa</b><small>Checklists de SST</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><div class="avatar" id="who-av">?</div><div class="who-t"><b id="who-name">Inspetor</b><span id="who-sub">Toque para identificar-se</span></div><button class="icon-btn" data-act="profile" aria-label="Editar perfil do inspetor">✎</button></div>

const Store={
  list:[],isAdmin:false,email:"",loadedAt:0,listeners:[],
  async init(){
    if(!sb)return;
    const {data}=await sb.auth.getSession();
    if(data&&data.session)await this.checkAdmin(data.session);
  },
  async checkAdmin(session){
    this.email=session?.user?.email||"";
    const {data,error}=await sb.rpc("is_admin");
    this.isAdmin=!error&&data===true;
    if(this.isAdmin)await this.load();
    return this.isAdmin;
  },
  async login(email,pass){
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error)throw new Error(/invalid/i.test(error.message)?"E-mail ou senha incorretos.":"Não foi possível entrar. Verifique a conexão.");
    if(!await this.checkAdmin(data.session)){await sb.auth.signOut();throw new Error("Este usuário não tem acesso de gestor.")}
  },
  async logout(){await sb.auth.signOut();this.isAdmin=false;this.list=[];this.email=""},
  on(fn){this.listeners.push(fn)},
  emit(){this.listeners.forEach(f=>f())},
  async load(){
    if(!this.isAdmin)return;
    const {data,error}=await sb.from("inspecoes").select("*").order("created_at",{ascending:false}).limit(2000);
    if(error){toast("Não foi possível carregar as inspeções.");return}
    this.list=data.map(r=>({id:r.id,formId:r.form_id,createdAt:Date.parse(r.created_at),data:r.data,inspetor:r.inspetor,area:r.area,resultado:r.resultado,c:r.c,nc:r.nc,na:r.na,fields:r.payload.fields||{},answers:r.payload.answers||[],final:r.payload.final||{},ncList:r.payload.ncList||[],fotos:r.fotos||[],nPhotos:(r.fotos||[]).length}));
    this.loadedAt=Date.now();
  },
  async save(rec,photos){
    if(!sb)throw new Error("App ainda não conectado ao Supabase.");
    const fotos=[];
    for(let i=0;i<photos.length;i++){
      const blob=await (await fetch(photos[i].data)).blob();
      const path=`${rec.id}/${i}.jpg`;
      const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg",upsert:false});
      if(error)throw new Error(`Falha ao enviar a foto ${i+1}. Verifique o sinal e tente de novo; suas respostas foram mantidas.`);
      fotos.push({key:photos[i].key,path});
    }
    const row={id:rec.id,form_id:rec.formId,data:rec.data||null,inspetor:rec.inspetor,area:rec.area,resultado:rec.resultado,c:rec.c,nc:rec.nc,na:rec.na,payload:{fields:rec.fields,answers:rec.answers,final:rec.final,ncList:rec.ncList},fotos};
    const {error}=await sb.from("inspecoes").insert(row);
    if(error)throw new Error("Não foi possível registrar agora. Verifique o sinal e tente de novo; suas respostas foram mantidas.");
    if(this.isAdmin){rec.fotos=fotos;rec.nPhotos=fotos.length;this.list.unshift(rec)}
  },
  async photos(id){
    const r=this.list.find(x=>x.id===id);if(!r||!r.fotos.length)return[];
    const {data,error}=await sb.storage.from(BUCKET).createSignedUrls(r.fotos.map(f=>f.path),3600);
    if(error||!data)return[];
    return data.map((d,i)=>({key:r.fotos[i].key,data:d.signedUrl})).filter(x=>x.data);
  },
  async remove(id){
    const r=this.list.find(x=>x.id===id);
    const {error}=await sb.from("inspecoes").delete().eq("id",id);
    if(error)throw error;
    if(r&&r.fotos.length)await sb.storage.from(BUCKET).remove(r.fotos.map(f=>f.path));
    this.list=this.list.filter(x=>x.id!==id);
  }
};

  if(/não liberad|interditad|suspens|cancelad|não conforme|nao conforme/.test(t))return"nc";
  if(/restri|após correção/.test(t))return"warn";

}

  else if(p==="checklists")viewChecklists();
  else if(p==="form"&&FM[arg])viewForm(arg);
  else if(p==="enviado")viewSent(arg);
  else if(p==="inspecoes")withFresh(viewList);

  else if(p==="dashboard")withFresh(viewDash);
  else location.replace("#/"+def);
  window.scrollTo(0,0);

  const L=Store.list.filter(r=>!dashRange||now-r.createdAt<=dashRange*864e5);
  const v=$("#view");
  const head=`<div class="page-h"><div><h1>Dashboard</h1><p>Visão geral das inspeções registradas.</p></div>
    <div class="seg-filter" role="group" aria-label="Período">${[[30,"30 dias"],[90,"90 dias"],[0,"Tudo"]].map(([d,l])=>`<button data-act="range" data-d="${d}" class="${dashRange===d?"on":""}">${l}</button>`).join("")}</div></div>`;
  if(!L.length){v.innerHTML=`<div class="wrap">${head}<div class="card empty"><h2>Nenhuma inspeção no período</h2><p>Escolha um checklist, preencha em campo e registre fotos das condições encontradas.</p><a class="btn pri" href="#/checklists">Iniciar inspeção</a></div></div>`;return}
  let C=0,NC=0,blocked=0;const byForm={},ncItems={};
  L.forEach(r=>{C+=r.c;NC+=r.nc;if(resultClass(r.resultado)==="nc")blocked++;
    const b=byForm[r.formId]||(byForm[r.formId]={n:0,c:0,nc:0});b.n++;b.c+=r.c;b.nc+=r.nc;
    (r.ncList||[]).forEach(t=>{const k=r.formId+"|"+t;ncItems[k]=(ncItems[k]||0)+1});
  });
  const idx=C+NC?Math.round(C/(C+NC)*100):0;
  const forms=Object.entries(byForm).sort((a,b)=>b[1].n-a[1].n);
  const maxN=forms[0][1].n;
  const tops=Object.entries(ncItems).sort((a,b)=>b[1]-a[1]).slice(0,8);
  v.innerHTML=`<div class="wrap">${head}
  <div class="kpis">
    <div class="card kpi"><span>Inspeções realizadas</span><b>${L.length}</b></div>
    <div class="card kpi ok"><span>Índice de conformidade</span><b>${idx}%</b></div>
    <div class="card kpi nc"><span>Itens não conformes</span><b>${NC}</b></div>
    <div class="card kpi"><span>Atividades não liberadas</span><b>${blocked}</b></div>
  </div>
  <div class="grid2">
    <div class="card panel"><h2>Inspeções por checklist</h2><div class="bars">${forms.map(([id,b])=>`<div class="bar"><span class="code">${esc(FM[id]?.code||id)}</span><div class="track"><div class="fill" style="width:${b.n/maxN*100}%"></div></div><span class="v">${b.n}</span></div>`).join("")}</div></div>
    <div class="card panel"><h2>Conformidade por checklist</h2><div class="bars">${forms.map(([id,b])=>{const p=b.c+b.nc?Math.round(b.c/(b.c+b.nc)*100):0;return`<div class="bar"><span class="code">${esc(FM[id]?.code||id)}</span><div class="track"><div class="fill ok" style="width:${p}%"></div></div><span class="v">${p}%</span></div>`}).join("")}</div></div>
  </div>
  <div class="grid2">
    <div class="card panel"><h2>Desvios mais recorrentes</h2>${tops.length?`<ul class="toplist">${tops.map(([k,n])=>{const[f,t]=k.split("|");return`<li><span class="n">${n}×</span><span><b>${esc(FM[f]?.code||f)}</b> · ${esc(t)}</span></li>`}).join("")}</ul>`:`<p class="muted">Nenhum item não conforme no período.</p>`}</div>
    <div class="card panel"><h2>Últimas inspeções</h2><div class="rows">${L.slice(0,6).map(rowHtml).join("")}</div><div style="margin-top:12px"><a class="btn sm" href="#/inspecoes">Ver todas</a></div></div>
  </div></div>`;
}

/* ---------- formulário ---------- */
function newState(f){
  const fields={};f.fields.forEach(fl=>{const l=fl.label.toLowerCase();fields[fl.label]=fl.type==="multi"?[]:fl.type==="date"?today():l==="nome"?profile.nome:l==="matrícula"?profile.matricula:l==="contrato"?profile.contrato:""});
  return{formId:f.id,fields,ans:{},notes:{},photos:{},final:{},open:{}};
}
function viewForm(id){
  const f=FM[id];
  if(!cur||cur.formId!==id){
    const dr=LS.get("ia_draft_"+id,null);
    cur=dr||newState(f);
    if(dr)setTimeout(()=>toast("Rascunho recuperado"),300);
  }
  renderForm();
}
function totals(f,st){let tot=0,done=0,c=0,nc=0,na=0;f.sections.forEach((s,si)=>s.items.forEach((_,ii)=>{tot++;const a=st.ans[si+"-"+ii];if(a!=null){done++;a===0?c++:a===1?nc++:na++}}));return{tot,done,c,nc,na}}
function renderForm(){
  const f=FM[cur.formId],st=cur;
  const T=totals(f,st);
  const fieldHtml=f.fields.map((fl,fi)=>{
    const v=st.fields[fl.label];
    if(fl.type==="multi")return`<div class="fld full"><label>${esc(fl.label)} <i>*</i></label><div class="chips" data-multi="${fi}">${fl.options.map((o,oi)=>`<button type="button" class="chip ${v.includes(o)?"on":""}" data-act="multi" data-fi="${fi}" data-oi="${oi}">${esc(o)}</button>`).join("")}</div></div>`;
    if(fl.type==="select")return`<div class="fld"><label for="f${fi}">${esc(fl.label)} <i>*</i></label><select class="inp" id="f${fi}" data-field="${esc(fl.label)}"><option value="">Selecione…</option>${fl.options.map(o=>`<option ${v===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
    return`<div class="fld"><label for="f${fi}">${esc(fl.label)} <i>*</i></label><input class="inp" id="f${fi}" type="${fl.type==="date"?"date":"text"}" data-field="${esc(fl.label)}" value="${esc(v)}"></div>`;
  }).join("");
  const secs=f.sections.map((s,si)=>{
    let d=0,n=0;s.items.forEach((_,ii)=>{const a=st.ans[si+"-"+ii];if(a!=null)d++;if(a===1)n++});
    const closed=st.open[si]===false;
    return`<section class="card sec ${closed?"closed":""}" data-si="${si}"><button type="button" class="sec-h" data-act="toggle-sec" data-si="${si}" aria-expanded="${!closed}"><h2>${esc(s.name)}</h2><span class="cnt" id="cnt-${si}">${d}/${s.items.length}${n?`<span class="ncb">${n} NC</span>`:""}</span><span class="chev">▾</span></button>
    <div class="sec-b"><div class="sec-tools"><button type="button" class="btn sm" data-act="all-ok" data-si="${si}">Marcar pendentes como ${esc(f.opts[0])}</button></div>${s.items.map((q,ii)=>itemHtml(f,st,si,ii,q)).join("")}</div></section>`;
  }).join("");
  const finals=f.final.map((fl,i)=>fl.type==="radio"
    ?`<div class="fld" data-final="${i}"><label>${esc(fl.label)} <i>*</i></label><div class="radio-list">${fl.options.map((o,oi)=>`<button type="button" class="${st.final[fl.label]===o?"on":""}" data-act="final" data-i="${i}" data-oi="${oi}">${esc(o)}</button>`).join("")}</div></div>`
    :`<div class="fld" data-final="${i}"><label for="fin${i}">${esc(fl.label)} <i>*</i></label><textarea class="inp" id="fin${i}" data-finaltext="${esc(fl.label)}" placeholder="Descreva aqui. Se não houver, escreva “Sem observações”.">${esc(st.final[fl.label]||"")}</textarea></div>`).join("");
  const gp=st.photos.geral||[];
  $("#view").innerHTML=`<div class="wrap">
    <div class="form-h"><a class="btn sm no-print" href="#/checklists" aria-label="Voltar">←</a><span class="emo" aria-hidden="true">${f.icon}</span><h1>${esc(f.code)}<small>${esc(f.title)}</small></h1></div>
    <div class="card fields">${fieldHtml}</div>
    ${secs}
    <div class="card finals"><h2>Fechamento</h2>${finals}
      <div class="fld"><label>Fotos gerais da inspeção</label><div class="thumbs" id="th-geral">${thumbs("geral",gp,MAX_GERAL_PH)}</div></div>
    </div>
    <div class="savebar"><button class="btn sm" data-act="discard">Descartar</button><div class="prog"><div class="track"><div class="fill" id="pfill" style="width:${T.done/T.tot*100}%"></div></div><small id="ptxt">${progTxt(T)}</small></div><button class="btn pri" data-act="submit">Registrar inspeção</button></div>
  </div>`;
}
function progTxt(T){return`${T.done} de ${T.tot} itens · ${T.c} conforme · ${T.nc} não conforme · ${T.na} N/A`}
function itemHtml(f,st,si,ii,q){
  const k=si+"-"+ii,a=st.ans[k],ph=st.photos[k]||[],note=st.notes[k]||"";
  const showExtra=a===1||ph.length||note||st.open["x"+k];
  return`<div class="item ${a===1?"is-nc":""}" data-k="${k}" id="it-${k}"><div class="item-row"><p class="q">${esc(q)}</p>
  <div class="ans">${f.opts.map((o,oi)=>`<button type="button" class="opt o${oi} ${a===oi?"on":""}" data-act="ans" data-k="${k}" data-oi="${oi}" aria-pressed="${a===oi}">${esc(o)}</button>`).join("")}
  <button type="button" class="tool" data-act="extra" data-k="${k}" aria-label="Foto e comentário">📷${ph.length?`<span class="badge">${ph.length}</span>`:""}</button></div></div>
  <div class="extra ${showExtra?"show":""}"><textarea class="inp" data-note="${k}" placeholder="${a===1?"Descreva o desvio e a ação imediata":"Comentário (opcional)"}" rows="2" style="min-height:56px">${esc(note)}</textarea><div class="thumbs" id="th-${k}">${thumbs(k,ph,MAX_ITEM_PH)}</div></div></div>`;
}
function thumbs(k,arr,max){
  return arr.map((src,i)=>`<div class="thumb"><img src="${src}" alt="Foto ${i+1}" data-act="zoom"><button type="button" data-act="rm-ph" data-k="${k}" data-i="${i}" aria-label="Remover foto">✕</button></div>`).join("")+(arr.length<max?`<button type="button" class="add-ph" data-act="add-ph" data-k="${k}">＋<br>Foto</button>`:"");
}
function refreshItem(k){
  const f=FM[cur.formId];const [si,ii]=k.split("-").map(Number);
  const el=document.getElementById("it-"+k);if(!el)return;
  el.outerHTML=itemHtml(f,cur,si,ii,f.sections[si].items[ii]);
  refreshCounts(si);
}
function refreshCounts(si){
  const f=FM[cur.formId],s=f.sections[si];let d=0,n=0;
  s.items.forEach((_,ii)=>{const a=cur.ans[si+"-"+ii];if(a!=null)d++;if(a===1)n++});
  const c=document.getElementById("cnt-"+si);if(c)c.innerHTML=`${d}/${s.items.length}${n?`<span class="ncb">${n} NC</span>`:""}`;
  const T=totals(f,cur);const pf=$("#pfill");if(pf){pf.style.width=T.done/T.tot*100+"%";$("#ptxt").textContent=progTxt(T)}
}
let draftTimer;
function saveDraft(){clearTimeout(draftTimer);draftTimer=setTimeout(()=>{if(!cur)return;if(!LS.set("ia_draft_"+cur.formId,cur)){const c={...cur,photos:{}};LS.set("ia_draft_"+cur.formId,c)}},600)}

/* compressão de fotos */
async function loadBitmap(file){
  try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){}
  return await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i)};i.onerror=rej;i.src=u});
}
async function compress(file){
  const img=await loadBitmap(file);
  let max=1280,q=.72,url="";
  for(let tries=0;tries<8;tries++){
    const sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    url=c.toDataURL("image/jpeg",q);
    if(url.length<170000)break;
    if(q>.5)q-=.1;else max=Math.round(max*.8);
  }
  return url;
}
let phTarget=null;
$("#file").addEventListener("change",async e=>{
  const files=[...e.target.files];e.target.value="";if(!cur||!phTarget||!files.length)return;
  const k=phTarget,max=k==="geral"?MAX_GERAL_PH:MAX_ITEM_PH;
  const arr=cur.photos[k]||(cur.photos[k]=[]);
  const room=max-arr.length;if(files.length>room)toast(`Limite de ${max} fotos ${k==="geral"?"gerais":"por item"}.`);
  for(const fl of files.slice(0,room)){try{arr.push(await compress(fl))}catch(err){toast("Não foi possível ler essa imagem.")}}
  if(k==="geral")$("#th-geral").innerHTML=thumbs("geral",arr,MAX_GERAL_PH);else{cur.open["x"+k]=true;refreshItem(k)}
  saveDraft();
});

function validate(f,st){
  const miss=[];
  f.fields.forEach((fl,fi)=>{const v=st.fields[fl.label];if(fl.type==="multi"?!v.length:!String(v||"").trim())miss.push(fl.type==="multi"?`[data-multi="${fi}"]`:"#f"+fi)});
  f.sections.forEach((s,si)=>s.items.forEach((_,ii)=>{if(st.ans[si+"-"+ii]==null)miss.push("#it-"+si+"-"+ii)}));
  f.final.forEach((fl,i)=>{if(!String(st.final[fl.label]||"").trim())miss.push(fl.type==="radio"?`[data-final="${i}"] .radio-list`:"#fin"+i)});
  return miss;
}
async function submit(btn){
  const f=FM[cur.formId],st=cur;
  document.querySelectorAll(".miss").forEach(e=>e.classList.remove("miss"));
  const miss=validate(f,st);
  if(miss.length){
    // abrir seções com pendências
    f.sections.forEach((s,si)=>{if(s.items.some((_,ii)=>st.ans[si+"-"+ii]==null)&&st.open[si]===false){st.open[si]=true;const el=document.querySelector(`.sec[data-si="${si}"]`);el&&el.classList.remove("closed")}});
    miss.forEach(s=>{const e=document.querySelector(s);e&&e.classList.add("miss")});
    const first=document.querySelector(miss[0]);first&&first.scrollIntoView({behavior:"smooth",block:"center"});
    toast(`Faltam ${miss.length} ${miss.length>1?"respostas obrigatórias":"resposta obrigatória"}.`);return;
  }
  const T=totals(f,st);
  const ncList=[],answers=[];
  f.sections.forEach((s,si)=>s.items.forEach((q,ii)=>{const k=si+"-"+ii,a=st.ans[k];answers.push({k,a,note:st.notes[k]||""});if(a===1)ncList.push(q)}));
  const radios=f.final.filter(x=>x.type==="radio");
  const resultado=radios.length?st.final[(radios.find(x=>/resultado|decis|libera/i.test(x.label))||radios[0]).label]:(T.nc?"Não Conforme":"Conforme");
  const photos=[];Object.entries(st.photos).forEach(([k,arr])=>arr.forEach(d=>photos.push({key:k,data:d})));
  const area=st.fields["Área Inspecionada"]||st.fields["Trabalhador(es) observado(s)"]||"";
  const rec={id:newId(),formId:f.id,createdAt:Date.now(),data:st.fields["Data"]||today(),inspetor:st.fields["Nome"]||"",area,fields:st.fields,answers,final:st.final,c:T.c,nc:T.nc,na:T.na,ncList,resultado,nPhotos:photos.length};
  btn.disabled=true;btn.textContent="Salvando…";
  try{
    await Store.save(rec,photos);
    profile={nome:st.fields["Nome"]||profile.nome,matricula:st.fields["Matrícula"]||profile.matricula,contrato:st.fields["Contrato"]||profile.contrato};LS.set("ia_profile",profile);paintProfile();
    LS.del("ia_draft_"+f.id);cur=null;
    toast("Inspeção registrada");location.hash=Store.isAdmin?"#/inspecao/"+rec.id:"#/enviado/"+f.id;
  }catch(e){btn.disabled=false;btn.textContent="Registrar inspeção";toast(e.message||"Erro ao salvar.")}
}

function detailHtml(r,f,p,photos,loading){
  const byKey={};(photos||[]).forEach(x=>(byKey[x.key]=byKey[x.key]||[]).push(x.data));
  const ans=Object.fromEntries((r.answers||[]).map(a=>[a.k,a]));
  const imgs=k=>(byKey[k]||[]).length?`<div class="thumbs">${byKey[k].map(s=>`<div class="thumb"><img src="${s}" alt="Foto" data-act="zoom"></div>`).join("")}</div>`:"";
  return`<div class="wrap">
  <div class="page-h no-print"><a class="btn sm" href="#/inspecoes">← Inspeções</a><div class="det-actions"><button class="btn" data-act="report" data-id="${r.id}">Baixar relatório</button><button class="btn" data-act="print">Imprimir / PDF</button><button class="btn danger" data-act="del" data-id="${r.id}">Excluir</button></div></div>
  <div class="card det-head"><div class="form-h" style="margin:0"><span class="emo" aria-hidden="true">${f.icon}</span><h1>${esc(f.code)}<small>${esc(f.title)}</small></h1></div>
  <div class="det-grid">${Object.entries(r.fields).map(([k,v])=>`<div><span>${esc(k)}</span><b>${esc(Array.isArray(v)?v.join(", "):k==="Data"?fmtDate(v):v)||"—"}</b></div>`).join("")}</div>
  <div class="score"><div><b style="color:var(--ok)">${r.c}</b>${esc(f.opts[0])}</div><div><b style="color:var(--nc)">${r.nc}</b>${esc(f.opts[1])}</div><div><b>${r.na}</b>N/A</div><div><b>${p==null?"—":p+"%"}</b>Conformidade</div><div><span class="pill ${resultClass(r.resultado)}" style="font-size:14px;margin-top:6px">${esc(r.resultado||"—")}</span></div></div></div>
  ${r.nc?`<div class="card sec"><div class="sec-h" style="cursor:default"><h2 style="color:var(--nc)">Itens não conformes</h2><span class="cnt">${r.nc}</span></div><div class="sec-b">${f.sections.map((s,si)=>s.items.map((q,ii)=>{const k=si+"-"+ii,a=ans[k];return a&&a.a===1?`<div class="item is-nc"><div class="item-row"><p class="q"><span class="muted">${esc(s.name)} ·</span> ${esc(q)}</p></div>${a.note?`<p class="note">${esc(a.note)}</p>`:""}${imgs(k)}</div>`:""}).join("")).join("")}</div></div>`:""}
  ${f.sections.map((s,si)=>`<div class="card sec closed" data-si="d${si}"><button type="button" class="sec-h" data-act="toggle-dsec"><h2>${esc(s.name)}</h2><span class="cnt">${s.items.filter((_,ii)=>ans[si+"-"+ii]?.a===1).length?`<span class="ncb">${s.items.filter((_,ii)=>ans[si+"-"+ii]?.a===1).length} NC</span>`:"Sem desvios"}</span><span class="chev">▾</span></button><div class="sec-b ans-list">${s.items.map((q,ii)=>{const k=si+"-"+ii,a=ans[k];return`<div class="item"><div class="item-row"><p class="q">${esc(q)}</p><span class="tag o${a?.a??2}">${a&&a.a!=null?esc(f.opts[a.a]):"—"}</span></div>${a?.note&&a.a!==1?`<p class="note">${esc(a.note)}</p>`:""}${a?.a!==1?imgs(k):""}</div>`}).join("")}</div></div>`).join("")}
  <div class="card finals"><h2>Fechamento</h2>${f.final.map(fl=>`<div><span class="muted" style="font-size:13px">${esc(fl.label)}</span><div style="white-space:pre-wrap;font-weight:500">${esc(r.final[fl.label]||"—")}</div></div>`).join("")}
  ${loading?`<p class="muted">Carregando fotos…</p>`:(byKey.geral||[]).length?`<div><span class="muted" style="font-size:13px">Fotos gerais</span>${imgs("geral")}</div>`:""}</div>
  <p class="muted" style="font-size:13px">Registrado em ${new Date(r.createdAt).toLocaleString("pt-BR")}</p></div>`;
}

/* ---------- exportação ---------- */
async function saveFile(filename,content,mime){
  let dl=null;try{dl=window.claude&&claude.use?await claude.use("downloads"):null}catch(e){}
  const blob=new Blob([content],{type:mime});
  if(dl){try{await dl.save({filename,data:blob});return}catch(e){if(e&&e.code==="declined")return;}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function csvCell(v){v=String(v??"");return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function exportCsv(){
  const head=["Data","Checklist","Título","Área","Inspetor","Matrícula","Contrato","Conformes","Não conformes","N/A","Conformidade %","Resultado","Itens não conformes","Fotos"];
  const lines=[head.join(";")].concat(Store.list.map(r=>{const f=FM[r.formId];return[fmtDate(r.data),f?.code,f?.title,r.area,r.inspetor,r.fields?.["Matrícula"],r.fields?.["Contrato"],r.c,r.nc,r.na,pctOf(r)??"",r.resultado,(r.ncList||[]).join(" | "),r.nPhotos].map(csvCell).join(";")}));
  await saveFile(`inspecoes_${today()}.csv`,"\ufeff"+lines.join("\r\n"),"text/csv;charset=utf-8");
}
async function exportReport(id){
  const r=Store.list.find(x=>x.id===id);if(!r)return;const f=FM[r.formId];
  toast("Gerando relatório…");
  const photos=r.nPhotos?await Store.photos(id):[];
  for(const p of photos){try{const b=await (await fetch(p.data)).blob();p.data=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)})}catch(e){}}
  const byKey={};photos.forEach(x=>(byKey[x.key]=byKey[x.key]||[]).push(x.data));
  const ans=Object.fromEntries((r.answers||[]).map(a=>[a.k,a]));
  const im=k=>(byKey[k]||[]).map(s=>`<img src="${s}">`).join("");
  const col=["#2E7D4F","#B3261E","#5F6873"];
  const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(f.code)} – ${fmtDate(r.data)}</title><style>body{font:14px/1.5 Arial,sans-serif;color:#1E2A33;max-width:900px;margin:24px auto;padding:0 16px}h1{margin:0;font-size:24px}h2{font-size:17px;margin:22px 0 8px;border-bottom:2px solid #A53D03;padding-bottom:4px}table{width:100%;border-collapse:collapse}td{border-bottom:1px solid #ddd;padding:6px 4px;vertical-align:top}td.r{width:130px;font-weight:bold;text-align:right}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 16px;margin-top:12px}.g span{display:block;font-size:12px;color:#5B6874}img{width:150px;height:150px;object-fit:cover;border-radius:6px;margin:4px 6px 0 0}.n{color:#5B6874;font-size:13px;white-space:pre-wrap}.res{display:inline-block;padding:4px 12px;border-radius:12px;background:#F6E6DB;color:#A53D03;font-weight:bold}</style></head><body>
  <h1>${esc(f.code)} – ${esc(f.title)}</h1><div class="g">${Object.entries(r.fields).map(([k,v])=>`<div><span>${esc(k)}</span><b>${esc(Array.isArray(v)?v.join(", "):k==="Data"?fmtDate(v):v)}</b></div>`).join("")}</div>
  <p><b>${r.c}</b> ${esc(f.opts[0])} · <b>${r.nc}</b> ${esc(f.opts[1])} · <b>${r.na}</b> N/A · Conformidade <b>${pctOf(r)??"—"}%</b> &nbsp; <span class="res">${esc(r.resultado||"")}</span></p>
  ${f.sections.map((s,si)=>`<h2>${esc(s.name)}</h2><table>${s.items.map((q,ii)=>{const k=si+"-"+ii,a=ans[k];return`<tr><td>${esc(q)}${a?.note?`<div class="n">${esc(a.note)}</div>`:""}${im(k)}</td><td class="r" style="color:${col[a?.a??2]}">${a&&a.a!=null?esc(f.opts[a.a]):"—"}</td></tr>`}).join("")}</table>`).join("")}
  <h2>Fechamento</h2>${f.final.map(fl=>`<p><b>${esc(fl.label)}:</b><br>${esc(r.final[fl.label]||"—").replace(/\n/g,"<br>")}</p>`).join("")}${(byKey.geral||[]).length?`<p><b>Fotos gerais</b><br>${im("geral")}</p>`:""}
  <p class="n">Gerado pelo Inspeção Ativa em ${new Date().toLocaleString("pt-BR")}</p></body></html>`;
  await saveFile(`${f.code.replace(/\s+/g,"")}_${r.data}_${(r.area||"inspecao").replace(/[^\wÀ-ú-]+/g,"_").slice(0,30)}.html`,html,"text/html");
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const act=t.dataset.act;
  if(act==="bg"&&e.target!==t)return;
  switch(act){
    case"bg":case"close":closeModal();break;
    case"profile":openProfile();break;
    case"gestor":openLogin();break;
    case"do-login":{const em=$("#l-em").value.trim(),pw=$("#l-pw").value;if(!em||!pw){$("#l-err").textContent="Informe e-mail e senha.";return}t.disabled=true;t.textContent="Entrando…";Store.login(em,pw).then(()=>{closeModal();toast("Modo gestor ativado");location.hash="#/dashboard";route()}).catch(err=>{t.disabled=false;t.textContent="Entrar";$("#l-err").textContent=err.message});break}
    case"logout":e.preventDefault();Store.logout().then(()=>{toast("Você saiu do modo gestor");location.hash="#/checklists";route()});break;
    case"save-profile":profile={nome:$("#p-nome").value.trim(),matricula:$("#p-mat").value.trim(),contrato:$("#p-con").value.trim()};LS.set("ia_profile",profile);paintProfile();closeModal();toast("Perfil salvo");break;
    case"range":dashRange=+t.dataset.d;viewDash();break;
    case"toggle-sec":{const si=t.dataset.si;const sec=t.closest(".sec");const closed=!sec.classList.contains("closed");sec.classList.toggle("closed",closed);t.setAttribute("aria-expanded",!closed);cur.open[si]=!closed;saveDraft();break}
    case"toggle-dsec":t.closest(".sec").classList.toggle("closed");break;
    case"ans":{const k=t.dataset.k,oi=+t.dataset.oi;cur.ans[k]=cur.ans[k]===oi?undefined:oi;if(cur.ans[k]===undefined)delete cur.ans[k];refreshItem(k);saveDraft();if(oi===1&&cur.ans[k]===1){const ta=document.querySelector(`[data-note="${k}"]`);ta&&ta.focus({preventScroll:true})}break}
    case"extra":{const k=t.dataset.k;cur.open["x"+k]=!(document.querySelector(`#it-${k} .extra`).classList.contains("show"));refreshItem(k);break}
    case"all-ok":{const si=+t.dataset.si;FM[cur.formId].sections[si].items.forEach((_,ii)=>{const k=si+"-"+ii;if(cur.ans[k]==null){cur.ans[k]=0;}});renderKeepScroll();saveDraft();break}
    case"final":{const fl=FM[cur.formId].final[+t.dataset.i];cur.final[fl.label]=fl.options[+t.dataset.oi];t.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===t));t.parentElement.classList.remove("miss");saveDraft();break}
    case"multi":{const fl=FM[cur.formId].fields[+t.dataset.fi];const o=fl.options[+t.dataset.oi];const arr=cur.fields[fl.label];const i=arr.indexOf(o);i>=0?arr.splice(i,1):arr.push(o);t.classList.toggle("on",i<0);saveDraft();break}
    case"add-ph":phTarget=t.dataset.k;$("#file").click();break;
    case"rm-ph":{const k=t.dataset.k;cur.photos[k].splice(+t.dataset.i,1);if(k==="geral")$("#th-geral").innerHTML=thumbs("geral",cur.photos.geral,MAX_GERAL_PH);else refreshItem(k);saveDraft();break}
    case"zoom":lightbox(t.src);break;
    case"submit":submit(t);break;
    case"discard":modal(`<h2>Descartar este preenchimento?</h2><p>As respostas e fotos deste checklist serão apagadas. Inspeções já registradas não são afetadas.</p><div class="acts"><button class="btn" data-act="close">Continuar preenchendo</button><button class="btn pri" data-act="do-discard">Descartar</button></div>`);break;
    case"do-discard":LS.del("ia_draft_"+cur.formId);cur=null;closeModal();location.hash="#/checklists";break;
    case"csv":exportCsv();break;
    case"refresh":Store.load().then(route);break;
    case"report":exportReport(t.dataset.id);break;
    case"print":document.querySelectorAll(".sec.closed").forEach(s=>s.classList.remove("closed"));setTimeout(()=>window.print(),100);break;
    case"del":modal(`<h2>Excluir inspeção?</h2><p>A inspeção e suas fotos serão apagadas de forma definitiva. Digite <b>EXCLUIR</b> para confirmar.</p><input class="inp" id="del-c" autocomplete="off"><div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="do-del" data-id="${t.dataset.id}">Excluir definitivamente</button></div>`);break;
    case"do-del":{if($("#del-c").value.trim().toUpperCase()!=="EXCLUIR"){$("#del-c").classList.add("miss");return}const r=Store.list.find(x=>x.id===t.dataset.id);closeModal();Store.remove(t.dataset.id).then(()=>{toast("Inspeção excluída");location.hash="#/inspecoes"}).catch(()=>toast("Não foi possível excluir. Verifique sua permissão."));break}
  }
});
function renderKeepScroll(){const y=window.scrollY;renderForm();window.scrollTo(0,y)}
document.addEventListener("input",e=>{
  const t=e.target;if(!cur)return;
  if(t.dataset.field!=null){cur.fields[t.dataset.field]=t.value;t.classList.remove("miss");saveDraft()}
  else if(t.dataset.note!=null){cur.notes[t.dataset.note]=t.value;saveDraft()}
  else if(t.dataset.finaltext!=null){cur.final[t.dataset.finaltext]=t.value;t.classList.remove("miss");saveDraft()}
});
document.addEventListener("change",e=>{const t=e.target;if(cur&&t.tagName==="SELECT"&&t.dataset.field!=null){cur.fields[t.dataset.field]=t.value;t.classList.remove("miss");saveDraft()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(e.key==="Enter"&&$("#l-pw")&&document.activeElement&&document.activeElement.closest(".modal")){const b=document.querySelector('[data-act="do-login"]');b&&b.click()}});
window.addEventListener("hashchange",route);
paintProfile();
Store.init().then(route);
</script>
